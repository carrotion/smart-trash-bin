# Nav2 파라미터 — "매핑하면서 동시에 자율주행" 구성 (2026-08-16).
# map_server/amcl은 안 씀 — SLAM Toolbox가 이미 /map과 map->odom TF를
# 실시간으로 제공하므로 global_costmap의 static_layer가 그 /map을 직접 구독한다
# (Nav2 공식 "Navigating While Mapping" 패턴).
#
# 로봇 실측: 차체 약 20x20cm(사용자 확인, 2026-08-16) -> 대각선 절반 ~0.141m.
# robot_radius는 처음 0.18로 잡았다가 실주행에서 로봇을 가둬버려 0.15로 낮춤
# (아래 global_costmap 주석 참고). 속도는 맵 품질/안전 우선으로 보수적으로 잡음
# (오늘 실주행 테스트에서 0.3m/s가 SLAM 품질에 적절했던 것 참고). 범퍼/낙하
# 센서가 아직 없어(로드맵의 VL53L1X 미장착) 라이다 단독 회피만 가능 —
# 첫 자율주행은 반드시 사람이 옆에서 지켜보고 즉시 개입 가능한 상태로 할 것.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # ⚠️ 0.2는 자율탐색에 너무 크다. explore가 고른 짧은 목표(0.19m)가 이미
      # 허용오차 안이라 로봇이 **한 발짝도 안 움직이고** "Reached the goal"이
      # 돼버렸다(2026-08-16 실주행에서 확인). 0.10으로 줄여 짧은 목표도 실제
      # 이동을 요구하게 한다.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    # 2.0이면 2초 앞을 시뮬레이션하는데, 좁은 곳에선 어느 방향으로 돌려도
    # 충돌 판정이 나서 복구 동작을 **아예 시도조차 안 한다**
    # ("Collision Ahead - Exiting Spin/DriveOnHeading"). 1.0으로 낮춰
    # 좁은 곳에서도 조금씩 빠져나올 여지를 준다.
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    # 빈 문자열로 두면 "Empty Tree" 에러로 목표마다 즉시 실패함(2026-08-16
    # 첫 테스트에서 발견) — nav2_bt_navigator가 제공하는 표준 기본 트리로 지정.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: false
      track_unknown_space: true
      # ⚠️ 0.18은 20x20cm 차체의 외접반경(0.141)에 여유를 더한 값이었는데,
      # 실주행에서 이게 로봇을 가둬버렸다. 주방에서 냉장고 옆 10cm 지점에
      # 붙자 "로봇 중심이 벽에서 0.18m 이상"을 만족 못 해 **자기가 서 있는
      # 셀이 통행불가**가 됐고, 회전·후진·경로계획이 전부 거부됐다.
      # 0.15로 낮춤 — 외접반경 0.141보다는 여전히 크므로 물리적 안전은 유지된다.
      robot_radius: 0.15
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # ⚠️ 반드시 앞에 "/"를 붙인 절대경로여야 함. 이 코스트맵은 /global_costmap
        # 네임스페이스 안의 노드라, 상대명 "map"은 /global_costmap/map으로 해석돼서
        # 존재하지 않는 토픽을 구독하고 "no map received"로 조용히 실패한다
        # (2026-08-16 첫 자율주행 테스트가 실패한 실제 원인).
        map_topic: "/map"
        # SLAM Toolbox의 /map은 TRANSIENT_LOCAL durability로 나오므로 구독자도
        # 맞춰줘야 붙는다(안 맞으면 QoS 불일치로 조용히 아무것도 안 받음).
        map_subscribe_transient_local: true
        transform_tolerance: 0.3
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 12.0
          # ⚠️ 로봇 자기 구조물(라이다 마운트/상판)이 360° 전방향 0.06~0.10m에
          # 찍힌다 — 안 걸러내면 코스트맵에 로봇을 감싼 장애물 링이 생겨서
          # 어떤 경로도 못 낸다. 실측상 0.10~0.30m가 빈 구간이라 0.15m로 컷.
          # (SLAM 쪽 min_laser_range와 같은 값으로 맞춰둘 것)
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.3이면 폭 0.6m 미만 통로가 사실상 전부 고비용/통행불가로 칠해진다.
        # 집 안엔 폭 0.5m급 통로(주방 냉장고 옆 등)가 흔해서 0.20으로 낮춤.
        # robot_radius(0.15)보다는 커야 벽에 붙는 경로를 억제할 수 있다.
        inflation_radius: 0.20
      # 기본값(false)이면 활성화 직후 1회만 전체 코스트맵을 내보내고 그 뒤론
      # 증분 업데이트만 발행해서, 나중에 붙은 구독자(진단 스크립트/대시보드)가
      # 전체 그림을 못 받는다. 진단 편의를 위해 매 주기 전체 발행.
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 12.0
          # ⚠️ 로봇 자기 구조물(라이다 마운트/상판)이 360° 전방향 0.06~0.10m에
          # 찍힌다 — 안 걸러내면 코스트맵에 로봇을 감싼 장애물 링이 생겨서
          # 어떤 경로도 못 낸다. 실측상 0.10~0.30m가 빈 구간이라 0.15m로 컷.
          # (SLAM 쪽 min_laser_range와 같은 값으로 맞춰둘 것)
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.3이면 폭 0.6m 미만 통로가 사실상 전부 고비용/통행불가로 칠해진다.
        # 집 안엔 폭 0.5m급 통로(주방 냉장고 옆 등)가 흔해서 0.20으로 낮춤.
        # robot_radius(0.15)보다는 커야 벽에 붙는 경로를 억제할 수 있다.
        inflation_radius: 0.20
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # ⚠️ 코스트맵(global_costmap/global_costmap 등)은 여기 넣으면 안 됨 —
    # planner_server/controller_server가 자기 on_configure에서 내부 코스트맵을
    # 직접 생성·전이시키므로, lifecycle_manager가 또 전이시키면 이중 전이가 된다.
    # 표준 nav2_bringup의 lifecycle_nodes 목록에도 코스트맵은 없음(2026-08-16 확인).
    node_names:
      ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
    bond_timeout: 10.0

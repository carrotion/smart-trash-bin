# Nav2 파라미터 — "매핑하면서 동시에 자율주행" 구성 (2026-08-16).
# map_server/amcl은 안 씀 — SLAM Toolbox가 이미 /map과 map->odom TF를
# 실시간으로 제공하므로 global_costmap의 static_layer가 그 /map을 직접 구독한다
# (Nav2 공식 "Navigating While Mapping" 패턴).
#
# 로봇 실측: 차체 약 20x20cm(사용자 확인, 2026-08-16) -> 대각선 절반 ~0.141m.
# robot_radius는 처음 0.18로 잡았다가 실주행에서 로봇을 가둬버려 0.15로 낮춤
# (아래 global_costmap 주석 참고). 속도는 맵 품질/안전 우선으로 보수적으로 잡음
# (오늘 실주행 테스트에서 0.3m/s가 SLAM 품질에 적절했던 것 참고). 범퍼/낙하
# 센서가 아직 없어(로드맵의 VL53L1X 미장착) 라이다 단독 회피만 가능 —
# 첫 자율주행은 반드시 사람이 옆에서 지켜보고 즉시 개입 가능한 상태로 할 것.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # ⚠️ 0.2는 자율탐색에 너무 크다. explore가 고른 짧은 목표(0.19m)가 이미
      # 허용오차 안이라 로봇이 **한 발짝도 안 움직이고** "Reached the goal"이
      # 돼버렸다(2026-08-16 실주행에서 확인). 0.10으로 줄여 짧은 목표도 실제
      # 이동을 요구하게 한다.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 2026-08-21: 다음 실주행부터 critic별 점수를 직접 로그로 본다 — 추측
      # 대신 실제 데이터로 판단하기 위함(사용자 지적).
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # ⚠️ 2026-08-17 완화: 출발/정지 때 모터 토크로 바퀴가 미끄러진다(사용자 관측).
      # 슬립 -> 오도메트리 과대추정 -> 그 순간 라이다 반사가 틀린 위치에 장애물로
      # 찍힘 -> 코스트맵에 유령 장애물이 쌓여 로봇이 자기가 만든 유령에 포위된다.
      # 실제로 로봇 셀 cost=99(통행불가)인데 라이다는 0.49m 여유를 보고했고,
      # 코스트맵을 비우니 즉시 0으로 떨어졌다 — 유령임이 확인됨.
      # 최고속도보다 **가감속**이 슬립의 직접 원인이므로 acc/decel을 더 크게 낮춤.
      # 2026-08-21: 실주행에서 체감 속도가 빠르다는 지적(사용자 직접 관측) —
      # 0.15 -> 0.08로 추가 하향.
      # 2026-08-22: 시나리오 A 실주행 중 또 "속도를 절반으로" 지적 — 0.08 -> 0.04,
      # max_vel_theta 0.4 -> 0.2. 실행 중인 세션엔 ros2 param set으로 즉시
      # 반영했고(재시작 없이), 이 값은 다음 실행부터 반영되는 영구 기록.
      # ⚠️ 2026-09-26 재설정 — 구동 기본값이 velocity로 바뀌어 명령한 속도가 실제로 나온다.
      #   위 08-21~22 "빠르다/절반으로" 지적 당시 실제 속도는 설정(0.15→0.08→0.04)과 무관하게 **약 0.4 m/s**
      #   (legacy 드라이버 deadzone, docs/todo.md #1). 즉 사용자가 빠르다고 한 건 0.4 m/s였다.
      #   - max 0.15: velocity 바닥 실측에서 속도 정확도 확인 구간(0.15 → 0.145), 예전 실제 속도의 약 1/3
      #   - min_speed_xy 0.05: 0.06 아래는 정지마찰로 붙었다 튐(0.04 명령 → 0.062, +55%)
      #   - theta 0.25~0.5: 0.2 rad/s 이하 제자리 회전은 붙었다 튐(09-26 회전 기록), 0.5는 정사각형 시험 속도
      #   - acc_lim_theta 0.75: 구동 노드 angular_accel_limit와 일치(더 크게 줘도 노드가 자름)
      #   ⚠️ 달리는 중 작은 회전 명령은 2~5할만 먹힌다(tools/curve_gain_test.py) — 경로 추종이 굼뜨면 이 때문
      #   판정: 자율주행 재개 첫 주행에서 사용자 체감 + 경로 이탈량. 체감 속도 조절은 max_vel_x/max_speed_xy만
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.05
      max_speed_xy: 0.15
      min_speed_theta: 0.25
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.75
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -0.75
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      # 2026-08-21: Twirling 추가 — 이동거리 대비 불필요한 회전에 페널티를
      # 주는 표준 DWB critic(이미 라이브러리에 있었는데 안 쓰고 있었다).
      # 궤적 로그에서 cmd_w가 0.3초 안에 부호를 계속 뒤집는 게 관찰됐는데
      # ("좌우로 계속 흔들며 간다"는 지적), 이게 직진 성향을 만들어줄 것으로
      # 기대함 — 정확한 인과관계는 아직 debug_trajectory_details로 검증 전.
      critics:
        ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"]
      Twirling.scale: 10.0
      # ⚠️ 2026-08-21: 0.02는 nav2 튜토리얼 기본값 그대로였다(경로/목표 정렬
      # critic 대비 1600배 작음). 실주행 로그(controller_server 콘솔 출력)로
      # 확인된 건 이만큼이다 — 벽에 접근하는 ~22초 동안 컨트롤러는 계속 "유효한
      # 궤적"을 찾아 주행했고, 이후 궤적 314개 전부가 무효(No valid trajectories)
      # 판정 나며 정체됐다. 첫 구간에서 장애물 critic이 얼마나 기여했는지는
      # **추정**이지 로그로 직접 확인한 건 아니다 — debug_trajectory_details로
      # 다음 시도에서 critic별 점수를 직접 봐야 확정 가능. 값 자체가 다른
      # critic 대비 극단적으로 작다는 사실만으로 올릴 근거는 충분하다고 판단.
      BaseObstacle.scale: 20.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    # 2.0이면 2초 앞을 시뮬레이션하는데, 좁은 곳에선 어느 방향으로 돌려도
    # 충돌 판정이 나서 복구 동작을 **아예 시도조차 안 한다**
    # ("Collision Ahead - Exiting Spin/DriveOnHeading"). 1.0으로 낮춰
    # 좁은 곳에서도 조금씩 빠져나올 여지를 준다.
    simulate_ahead_time: 1.0
    # 2026-08-22: 시나리오 A 실주행 중 "속도를 절반으로" 지적 — 0.6 -> 0.3.
    # (참고: BackUp의 후진 속도 0.15m/s는 여기 없다 — bt_navigator가 읽는
    # BT XML의 backup_speed 속성값이라 별도로 고쳐야 함. 아래
    # default_nav_to_pose_bt_xml 항목 참고.)
    # ⚠️ 2026-09-26: legacy 시절엔 설정과 무관한 속도로 돌았다(회전 PI 발진). velocity에선 명령대로 돈다 —
    #   0.2 rad/s 이하 제자리 회전은 정지마찰로 붙었다 튐 → min 0.25, max는 정사각형 시험 속도 0.5,
    #   가속은 구동 노드 angular_accel_limit 0.75와 일치. 후진 0.075 m/s는 최저 부드러운 속도(0.06)보다 커서 유지
    max_rotational_vel: 0.5
    min_rotational_vel: 0.25
    rotational_acc_lim: 0.75

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    # 빈 문자열로 두면 "Empty Tree" 에러로 목표마다 즉시 실패함(2026-08-16
    # 첫 테스트에서 발견) — nav2_bt_navigator가 제공하는 표준 기본 트리로 지정.
    # 2026-08-22: 표준 트리를 복사해서 backup_speed만 0.15 -> 0.075로 낮춘
    # 우리 사본으로 교체(behavior_trees/navigate_to_pose_slow_recovery.xml).
    # BackUp 후진 속도는 nav2_params.yaml 어디에도 파라미터가 없고 이 BT XML의
    # 속성값으로만 박혀있어서, DWB/Spin 속도를 낮춰도 후진만 그대로 0.15로
    # 남아있었다(실측: cmd_v 최대 관측치가 정확히 0.15로 DWB 상한 0.08을
    # 넘어서 발견). ⚠️ 이 값은 bt_navigator가 기동(on_configure) 시점에만
    # 읽으므로 파라미터를 바꿔도 스택 재시작 전까지는 적용 안 됨.
    default_nav_to_pose_bt_xml: "/home/carrotian/smart-trash-bin/robot/src/smart_trash_bringup/behavior_trees/navigate_to_pose_slow_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: false
      track_unknown_space: true
      # ⚠️ 2026-08-17: robot_radius(원 근사) -> footprint(실제 사각형)로 변경.
      #
      # 이 로봇은 20x20cm 정사각형이다. 원으로 근사하면 모서리 바깥의 빈 공간까지
      # 로봇이 차지한 것으로 쳐서 실제보다 보수적이 된다:
      #   내접반경 0.100m (이 안쪽은 확실히 충돌)
      #   외접반경 0.141m (회전할 때 필요한 값)
      #   기존 robot_radius 0.150m  <- 외접보다도 0.9cm 크게 잡혀 있었다
      # 그래서 벽에 평면을 마주해도 0.15m를 요구했고, 실측 0.19m 떨어진 구석에서
      # 셀 해상도(0.05m)까지 겹쳐 "통행불가"로 판정돼 경로계획이 330건 실패했다.
      # **로봇은 물리적으로 낀 게 아니었다**(사용자 확인) — 코스트맵만 그렇게 본 것.
      #
      # footprint를 쓰면 Nav2가 내접/외접을 스스로 계산해서, 평면을 마주할 땐
      # 0.10m까지 접근하고 회전할 땐 0.141m를 요구한다. 상황에 맞게 판단한다.
      # 차체 중심 기준 반폭 0.10m + 여유 0.01m.
      footprint: "[[0.11, 0.11], [0.11, -0.11], [-0.11, -0.11], [-0.11, 0.11]]"
      footprint_padding: 0.0
      resolution: 0.05
      # ⚠️ obstacle_layer를 일부러 뺐다 (2026-08-17).
      # "매핑 중 네비게이션"에서는 SLAM Toolbox가 이미 라이다를 확률적으로 융합해
      # /map을 만들고, 잘못 찍힌 점도 재관측으로 지워준다. 그런데 Nav2의
      # obstacle_layer는 같은 라이다를 한 번 더 마킹하면서 **지우는 능력은 약하다**
      # — 레이가 통과해야만 지워지므로, 슬립으로 위치가 튄 순간 찍힌 점이
      # 영구 잔류한다. 그렇게 쌓인 유령이 로봇 셀을 inscribed(99)로 만들어
      # 경로계획이 통째로 실패했다(2026-08-17 실주행에서 확인).
      # 동적 장애물 회피는 local_costmap의 obstacle_layer가 담당하므로 손실 없음.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # ⚠️ 반드시 앞에 "/"를 붙인 절대경로여야 함. 이 코스트맵은 /global_costmap
        # 네임스페이스 안의 노드라, 상대명 "map"은 /global_costmap/map으로 해석돼서
        # 존재하지 않는 토픽을 구독하고 "no map received"로 조용히 실패한다
        # (2026-08-16 첫 자율주행 테스트가 실패한 실제 원인).
        map_topic: "/map"
        # SLAM Toolbox의 /map은 TRANSIENT_LOCAL durability로 나오므로 구독자도
        # 맞춰줘야 붙는다(안 맞으면 QoS 불일치로 조용히 아무것도 안 받음).
        map_subscribe_transient_local: true
        transform_tolerance: 0.3
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 12.0
          # ⚠️⚠️ 2026-09-04 정정 — 0.11은 라이다 기준이라 로봇 앞면(0.11m)보다도
          # 넓은 사각지대를 만들고 있었다. nav2_costmap_2d obstacle_layer.cpp
          # (world_dist_sq 계산, 460~503행)의 근접 컷오프는 **base_link가 아니라
          # 센서 원점(obs.origin_) 기준**이다 — 그런데 라이다는 base_link보다
          # 5.4cm 앞에 있다(실측 확정 x=0.054m). 그래서 이 값 0.11은 실제로는
          # base_link 기준 0.11+0.054=**0.164m**까지 장애물 마킹을 막고 있었다
          # — 로봇 몸통 앞끝(0.11m)에 물체가 닿기 직전까지도 코스트맵엔 안 보였다는
          # 뜻. `scan_self_filter`(±0.105m, base_link 기준 정사각형 폴리곤,
          # 2026-09-04 실측 검증 완료 — 오탐/누락 0건)가 이미 자기 구조물 제거를
          # 기하학적으로 정확히 처리하므로, 여기서 또 거리로 자르는 건 이제
          # 불필요할 뿐 아니라 위 사각지대를 만드는 원인이었다. nav2 기본값(0.0)
          # 으로 되돌림 — self-filter가 이미 뒤를 받쳐준다.
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-21: 3.0 -> 2.0. inflation_radius(0.20)는 그대로 두고
        # (더 넓히면 0.5m급 좁은 통로가 막힘 — 위 이력 참고) 그 반경 안에서
        # 비용이 완만하게 오르도록만 바꿈. 장애물 바로 옆보다 열린 공간
        # 가운데를 선호하게 만드는 목적 — 통로 자체를 막지는 않는다.
        cost_scaling_factor: 2.0
        # 0.3이면 폭 0.6m 미만 통로가 사실상 전부 고비용/통행불가로 칠해진다.
        # 집 안엔 폭 0.5m급 통로(주방 냉장고 옆 등)가 흔해서 0.20으로 낮춤.
        # robot_radius(0.15)보다는 커야 벽에 붙는 경로를 억제할 수 있다.
        inflation_radius: 0.20
      # 기본값(false)이면 활성화 직후 1회만 전체 코스트맵을 내보내고 그 뒤론
      # 증분 업데이트만 발행해서, 나중에 붙은 구독자(진단 스크립트/대시보드)가
      # 전체 그림을 못 받는다. 진단 편의를 위해 매 주기 전체 발행.
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # global_costmap과 동일 이유로 사각형 외곽선 사용(위 주석 참고).
      footprint: "[[0.11, 0.11], [0.11, -0.11], [-0.11, -0.11], [-0.11, 0.11]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 12.0
          # ⚠️⚠️ 2026-09-04 정정 — global_costmap과 동일한 이유로 0.0으로 변경.
          # 이 값(라이다 기준 0.11m)이 base_link 기준으로는 0.164m(라이다가
          # base_link보다 5.4cm 앞이라 0.11+0.054)까지 장애물 마킹을 막고
          # 있었다 — 로봇 몸통 앞끝(0.11m)에 닿기 직전까지도 코스트맵엔 안
          # 보인 것. 상세 근거는 위 global_costmap 절 주석 참고
          # (nav2_costmap_2d obstacle_layer.cpp의 world_dist_sq가 센서 원점
          # obs.origin_ 기준임을 소스로 확인). scan_self_filter가 이미 자기
          # 구조물을 base_link 기준 정사각형 폴리곤으로 정확히 걸러낸다
          # (2026-09-04 검증 완료) — 여기서 또 거리로 자를 필요 없음.
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-21: 3.0 -> 2.0. inflation_radius(0.20)는 그대로 두고
        # (더 넓히면 0.5m급 좁은 통로가 막힘 — 위 이력 참고) 그 반경 안에서
        # 비용이 완만하게 오르도록만 바꿈. 장애물 바로 옆보다 열린 공간
        # 가운데를 선호하게 만드는 목적 — 통로 자체를 막지는 않는다.
        cost_scaling_factor: 2.0
        # 0.3이면 폭 0.6m 미만 통로가 사실상 전부 고비용/통행불가로 칠해진다.
        # 집 안엔 폭 0.5m급 통로(주방 냉장고 옆 등)가 흔해서 0.20으로 낮춤.
        # robot_radius(0.15)보다는 커야 벽에 붙는 경로를 억제할 수 있다.
        inflation_radius: 0.20
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # ⚠️ 코스트맵(global_costmap/global_costmap 등)은 여기 넣으면 안 됨 —
    # planner_server/controller_server가 자기 on_configure에서 내부 코스트맵을
    # 직접 생성·전이시키므로, lifecycle_manager가 또 전이시키면 이중 전이가 된다.
    # 표준 nav2_bringup의 lifecycle_nodes 목록에도 코스트맵은 없음(2026-08-16 확인).
    node_names:
      ["controller_server", "planner_server", "behavior_server", "bt_navigator", "collision_monitor"]
    bond_timeout: 10.0

# 충돌 감시(todo #12, 2026-09-27) — Nav2 명령(controller/behavior → cmd_vel_nav)을 받아 안전할 때만 /cmd_vel로.
# ⚠️ 대시보드 수동 조종(/cmd_vel 직접)은 이 감시를 거치지 않는다.
# 정지 구역 근거(로봇 중심 기준, 차체 ±0.11):
#   전진 앞 0.20 = 앞면 0.11 + 정지거리 0.05(0.15 m/s, 능동 제동, tools/stop_distance_test.py)
#               + 반응 지연 0.023(스캔 0.1초 + 제어 0.05초) × 0.15 m/s + 여유 0.02
#   후진 뒤 −0.17 = 뒷면 −0.11 + 후진 0.075 m/s 정지·지연 약 0.03 + 여유 0.03
#   제자리 회전: 차체 모서리 회전 반경 0.156 → 반지름 0.20 팔각형(내접 0.185)
#   min_points 3: 차체 경계 자기반사 점(바닥 녹화에서 스캔의 6~9%, 1점짜리)으로 서지 않게.
#     물체 2 cm 폭은 0.15 m에서 약 10점 → 3점이면 충분히 잡힌다
# source_timeout 0.5: 스캔(10 Hz)이 0.5초 끊기면 정지 — 09-26 라이다 드라이버 3.3초 멈춤 대책(todo #13).
#   Iron부터 이 시간 초과는 경고가 아니라 **정지**(docs.nav2.org Iron 이전 가이드, PR #3880)
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["VelocityPolygonStop"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 3
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_stop"
      velocity_polygons: ["rotation", "translation_forward", "translation_backward", "stopped"]
      holonomic: false
      rotation:
        points: "[[0.20, 0.0], [0.141, 0.141], [0.0, 0.20], [-0.141, 0.141], [-0.20, 0.0], [-0.141, -0.141], [0.0, -0.20], [0.141, -0.141]]"
        linear_min: -0.03
        linear_max: 0.03
        theta_min: -3.0
        theta_max: 3.0
      translation_forward:
        points: "[[0.20, 0.14], [0.20, -0.14], [0.0, -0.14], [0.0, 0.14]]"
        linear_min: 0.03
        linear_max: 1.0
        theta_min: -3.0
        theta_max: 3.0
      translation_backward:
        points: "[[0.0, 0.14], [0.0, -0.14], [-0.17, -0.14], [-0.17, 0.14]]"
        linear_min: -1.0
        linear_max: -0.03
        theta_min: -3.0
        theta_max: 3.0
      # 마지막(대체) 구역 — 위에 안 걸리는 속도 전부. 정지 중엔 stop이 의미 없으므로 회전과 같게
      stopped:
        points: "[[0.20, 0.0], [0.141, 0.141], [0.0, 0.20], [-0.141, 0.141], [-0.20, 0.0], [-0.141, -0.141], [0.0, -0.20], [0.141, -0.141]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -3.0
        theta_max: 3.0
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      source_timeout: 0.5
      enabled: True

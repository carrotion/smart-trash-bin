# 라이다 스캔에서 **로봇 자기 구조물**을 제거하는 필터 체인.
# laser_filters(ros-perception) 사용 — 직접 구현하지 않는다.
#
# ── 왜 다각형인가 (2026-08-17 실측 근거) ────────────────────────────────
# 이전에는 자체 노드(scan_filter_node)가 "거리 X 미만이면 차체"로 잘랐다.
# 그 방식은 각도 정보를 통째로 버려서, 임계값 0.15m일 때 **벽에 닿기 직전 구간까지
# 같이 지웠다.** 차체 반폭이 0.11m라 벽에 닿으면 라이다에서 0.11m로 잡히는데 그게
# 사라지니 코스트맵에서 벽이 지워지고 컨트롤러가 계속 밀어붙였다(실주행에서 관측).
#
# 다각형이 맞는 이유는 감이 아니라 기하다:
#   차체가 22x22cm이고 라이다가 그 중심에 있으므로, **차체 다각형 안쪽에 찍힌 반사는
#   물리적으로 실제 장애물일 수 없다.** 자기 것과 진짜 장애물이 원리적으로 갈린다.
#
# 실측(스캔 128개, 2도 빈): 자기 구조물은 **정확히 0.080m**에 있고 표준편차가
# 0.0000~0.0005로 사실상 0이다. 각도는 100~104°, 158~166°, 186~194°(케이블 뭉치),
# 252~254°, 324~330°에 몰려 있다. 전부 아래 다각형(±0.105) 안쪽이라 제거된다.
#
# ── 다각형 크기를 실제 차체(±0.11)보다 살짝 작게 잡은 이유 ──────────────
# 벽에 닿으면 그 벽면은 정확히 0.11m에 놓인다. 다각형을 0.11로 잡으면 경계에 걸려
# 지워질 수 있다. 0.105로 **안쪽으로 5mm 물려서**, 구조물(0.080)과는 25mm 여유를 두고
# 접촉한 벽(0.110)은 확실히 살린다.
#
# ── Static 변형을 쓰는 이유 ─────────────────────────────────────────────
# LaserScanPolygonFilter는 매 스캔을 polygon_frame으로 변환하고, **TF를 못 얻으면
# 스캔을 통째로 버린다**(polygon_filter.h:390). 기동 직후 TF가 늦으면 SLAM이 굶는다.
# StaticLaserScanPolygonFilter는 라이다가 고정이라는 전제로 **다각형을 한 번만**
# 변환하므로 매 스캔 TF 조회가 없고 CPU도 덜 쓴다. 우리 라이다는 볼트 고정이다.
# ⚠️ 최상위 키는 **`/**`**여야 한다. ROS 2는 이 키가 노드 이름과 일치할 때만
# 파라미터를 먹인다. 예전에 `scan_to_scan_filter_chain:`으로 두고 런치에서 노드
# 이름을 `scan_self_filter`로 줬더니, 파라미터가 하나도 안 들어가 **필터 체인이 빈 채로
# 스캔을 그대로 통과**시켰다. 그런데 /scan은 10Hz로 멀쩡히 나와서 겉보기엔 정상이었다.
# (토픽 주파수는 동작이 맞다는 증거가 아니다 — 같은 날 자기센서에서도 같은 함정을 겪었다)
/**:
  ros__parameters:
    filter1:
      name: self_polygon_filter
      type: laser_filters/StaticLaserScanPolygonFilter
      params:
        polygon_frame: base_link
        # 차체 사각형(반폭 0.105m). 실제 footprint는 ±0.11 — 위 설명 참고.
        polygon: '[[0.105, 0.105], [0.105, -0.105], [-0.105, -0.105], [-0.105, 0.105]]'
        # false = 다각형 **안쪽**을 제거 (자기 구조물 제거가 목적)
        invert: false
        transform_timeout: 5.0

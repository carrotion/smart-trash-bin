# explore_lite 설정 (2026-08-16). costmap_topic/costmap_updates_topic을
# Nav2 costmap이 아니라 SLAM Toolbox가 직접 내는 /map, /map_updates로 잡음 —
# 기본값이 이미 이 이름이라 별도 리매핑 불필요(feature/slam_toolbox_compat
# 브랜치가 정확히 이 조합에서 나던 seg fault/멈춤을 고친 버전이라 이걸 씀).
# 프론티어 목표는 여기서 정하고, 실제 그 지점까지의 안전한 경로/장애물 회피는
# controller_server/planner_server(각자의 costmap, 인플레이션 포함)가 담당.
/**:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true
    planner_frequency: 0.15
    progress_timeout: 30.0
    # ⚠️ 3.0(기본값)은 "가까운 프론티어"를 너무 강하게 선호한다. 그러면 탐색
    # 초기에 0.2m짜리 목표를 고르는데, 그 거리는 SLAM Toolbox의 노드 추가
    # 임계값(minimum_travel_distance 0.3m)보다 짧아서 **맵이 자라지 않는다**.
    # 맵이 안 자라니 새 프론티어도 안 생기고 explore가 "All frontiers
    # traversed"로 멈춰버린다 — 2026-08-16 첫 실주행이 정확히 이 교착이었다.
    # 1.0으로 낮춰 프론티어 크기(gain_scale)의 비중을 키우면 더 멀고 실속 있는
    # 목표를 골라서 매 이동이 맵 성장으로 이어진다.
    potential_scale: 1.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    # ⚠️ 2026-08-17 낮춤 (0.5 -> 0.2). 실측: 프론티어 덩어리가 107개나 있는데
    # 0.5m 기준을 통과하는 건 **단 2개**였다. 그 둘을 소진하면 맵이 9%밖에
    # 안 그려졌는데 "All frontiers traversed"로 탐색이 끝나버린다(4회 재현).
    # 덩어리가 잘게 쪼개지는 이유는 라이다 85° 차폐 — 사각지대가 미지영역을
    # 조각내기 때문.
    # 예전엔 "작은 프론티어를 쫓다 이동거리가 짧아진다"고 걱정해 올렸었는데,
    # 이제 min_frontier_distance가 목표를 0.6m 이상으로 강제하므로 그 걱정이
    # 사라졌다. 후보를 많이 확보하는 쪽이 맞다.
    min_frontier_size: 0.2
    # 라이다 사각지대(85° 차폐)가 로봇에 딱 붙은 미지영역 쐐기를 만들고,
    # 그게 프론티어로 잡히면 목표가 발밑(0.1m)에 찍혀 아무 데도 안 간다.
    # 이 거리보다 가까운 프론티어는 무시해서 실제로 이동하게 만든다.
    # 이동하면 사각지대도 같이 움직여 쐐기가 스스로 메워진다.
    min_frontier_distance: 0.6
    return_to_init: false

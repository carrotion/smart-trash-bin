# /etc/systemd/system/apt-daily.timer.d/smart-trash.conf
# 패키지 목록 갱신을 새벽(도크 충전 시간)으로 고정. 기본값은 6·18시 + 최대 12시간 무작위라
# 2026-09-26 오후 2시에 돌았다. Persistent=false: 그 시각에 꺼져 있었으면 건너뛴다
# (true면 다음 부팅 직후 바로 실행 — 주행 준비 중에 돌 수 있다).
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:00
RandomizedDelaySec=15min
Persistent=false
